about:
    getToKnowUs: "Poznaj nas"
    title: "Dekoracje tworzone z pasją i miłością"
    description1: "Ania Balloons to coś więcej niż dekoracje balonowe. To sposób na stworzenie wyjątkowej atmosfery i nadanie każdemu wydarzeniu indywidualnego charakteru."
    description2: "Tworzymy dekoracje na urodziny, baby shower, rodzinne spotkania, wesela, przyjęcia dla dzieci oraz imprezy firmowe. Od efektownych girland i ścianek balonowych po kolorowe zwierzątka i figury z balonów – każdą realizację dopasowujemy do okazji, miejsca oraz wizji naszego klienta."
    description3: "Działamy w Chicago i okolicznych miejscowościach, w tym w Naperville i Wheaton. Zależy nam, aby cały proces był prosty i przyjemny – od pierwszego kontaktu aż po przygotowanie dekoracji na Twoje wydarzenie."
